background {
    monitor =
    path = ~/Pictures/maybe.jpg
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(57, 211, 83)
    inner_color = rgb(13, 15, 19)
    font_color = rgb(168, 176, 192)
    fade_on_empty = true
    placeholder_text = Password...
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgb(57, 211, 83)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgb(168, 176, 192)
    font_size = 20
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = rgb(168, 176, 192)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] echo " $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgb(57, 211, 83)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -30, -30
    halign = right
    valign = top
}

label {
    monitor =
    text =    
    color = rgb(168, 176, 192)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}
