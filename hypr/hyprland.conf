monitor=,preferred,auto,1.60
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun -theme ~/.config/rofi/config.rasi
env = XCURSOR_SIZE,24
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}
general {
    gaps_in = 8
    gaps_out = 18
    border_size = 3
    col.active_border = rgba(00ff99ff)
    col.inactive_border = rgba(333333aa)
    layout = dwindle
}
decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
    }
}
animations {
    enabled = true
    bezier = smooth,0.25,0.1,0.25,1
    animation = windows,1,5,smooth
    animation = windowsOut,1,5,smooth
    animation = border,1,8,smooth
    animation = fade,1,5,smooth
    animation = workspaces,1,6,smooth
}
dwindle {
    preserve_split = true
}

# =====================
# SHORTCUTS (i3 STYLE)
# =====================

# terminal
bind = SUPER, RETURN, exec, $terminal

# launcher
bind = SUPER, D, exec, $menu

# close window
bind = SUPER SHIFT, Q, killactive

# exit hyprland
bind = SUPER SHIFT, M, exit

# fullscreen
bind = SUPER, F, fullscreen

# floating
bind = SUPER, V, togglefloating

# focus movement (i3 layout: j=left, k=down, l=up, ;=right)
bind = SUPER, J, movefocus, l
bind = SUPER, K, movefocus, d
bind = SUPER, L, movefocus, u
bind = SUPER, semicolon, movefocus, r

bind = SUPER, Left, movefocus, l
bind = SUPER, Down, movefocus, d
bind = SUPER, Up, movefocus, u
bind = SUPER, Right, movefocus, r

# move windows
bind = SUPER SHIFT, J, movewindow, l
bind = SUPER SHIFT, K, movewindow, d
bind = SUPER SHIFT, L, movewindow, u
bind = SUPER SHIFT, semicolon, movewindow, r

bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Down, movewindow, d
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Right, movewindow, r

# workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# move container to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# scroll through workspaces
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# reload config
bind = SUPER SHIFT, C, exec, hyprctl reload

# lock screen
bind = SUPER SHIFT, X, exec, hyprlock

# resize mode
bind = SUPER, R, submap, resize
submap = resize
binde = , J, resizeactive, -10 0
binde = , L, resizeactive, 10 0
binde = , K, resizeactive, 0 -10
binde = , semicolon, resizeactive, 0 10
binde = , Left, resizeactive, -10 0
binde = , Right, resizeactive, 10 0
binde = , Up, resizeactive, 0 -10
binde = , Down, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# media keys
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindel = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# screenshots
bind = , PRINT, exec, grim ~/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot saved"
bind = SUPER, PRINT, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot saved"

# web app shortcuts
bind = SUPER SHIFT, Y, exec, brave-browser --app="https://music.youtube.com"
bind = SUPER SHIFT, W, exec, brave-browser --app="https://web.whatsapp.com"
bind = SUPER SHIFT, T, exec, brave-browser --app="https://takeuforward.org"

# power off
bind = SUPER, END, exec, poweroff

# notification action
bind = SUPER, N, exec, ~/.config/dunst/rofi_action.sh

# hydration alarm toggle
bind = SUPER SHIFT, A, exec, ~/water_alarm.sh

# startup
exec-once = waybar
exec-once = dunst
exec-once = swww-daemon
exec-once = sh -c 'sleep 1 && swww img ~/Pictures/maybe.jpg'
bind = SUPER, ESCAPE, exec, wlogout
bind = SUPER, F1, exec, ~/.local/bin/theme-switch
